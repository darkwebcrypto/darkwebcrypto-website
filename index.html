<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Мои Соцсети</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --card:#111118;
  --border:#1e1e2e;
  --text:#e8e8f0;
  --muted:#555570;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-y:auto;
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
}

.container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  padding:40px 20px;
  max-width:520px;
  width:100%;
}

.avatar{
  width:90px;height:90px;
  border-radius:50%;overflow:hidden;
  border:2px solid rgba(145,70,255,.4);
  box-shadow:0 0 40px rgba(145,70,255,.3);
  flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}

h1{font-family:'Bebas Neue';font-size:2.4rem;letter-spacing:4px;text-align:center;}

.divider{
  width:100%;height:1px;background:var(--border);
  margin:4px 0 12px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.owned{
  background:var(--bg);padding:0 12px;
  font-size:.7rem;color:rgba(232,232,240,.5);letter-spacing:2px;
}

.bio{
  font-size:.8rem;
  color:var(--muted);
  letter-spacing:1px;
  text-align:center;
  margin-top:-8px;
}

/* ========== GRID ========== */
.grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  width:100%;
}

/* ========== BUTTONS ========== */
.btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:16px 8px;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--border);
  text-decoration:none;
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-size:.82rem;
  font-weight:600;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  text-align:center;
  /* aspect-ratio убран — заменён фиксированным паддингом для стабильности */
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.btn::before{
  content:'';position:absolute;inset:0;
  opacity:0;transition:opacity .25s ease;
}
.btn:hover{transform:translateY(-4px) scale(1.03);}
.btn:active{transform:translateY(0) scale(0.96);}

.btn-yt::before{background:linear-gradient(135deg,rgba(255,0,0,.12),transparent);}
.btn-yt:hover,.btn-yt:focus-visible{border-color:rgba(255,0,0,.5);box-shadow:0 8px 32px rgba(255,0,0,.2);}
.btn-yt:hover::before{opacity:1;}

.btn-dc::before{background:linear-gradient(135deg,rgba(88,101,242,.15),transparent);}
.btn-dc:hover,.btn-dc:focus-visible{border-color:rgba(88,101,242,.5);box-shadow:0 8px 32px rgba(88,101,242,.2);}
.btn-dc:hover::before{opacity:1;}

.btn-tw::before{background:linear-gradient(135deg,rgba(145,70,255,.15),transparent);}
.btn-tw:hover,.btn-tw:focus-visible{border-color:rgba(145,70,255,.5);box-shadow:0 8px 32px rgba(145,70,255,.2);}
.btn-tw:hover::before{opacity:1;}

.btn-tg::before{background:linear-gradient(135deg,rgba(38,165,228,.15),transparent);}
.btn-tg:hover,.btn-tg:focus-visible{border-color:rgba(38,165,228,.5);box-shadow:0 8px 32px rgba(38,165,228,.2);}
.btn-tg:hover::before{opacity:1;}

.btn-sc::before{background:linear-gradient(135deg,rgba(255,85,0,.15),transparent);}
.btn-sc:hover,.btn-sc:focus-visible{border-color:rgba(255,85,0,.5);box-shadow:0 8px 32px rgba(255,85,0,.2);}
.btn-sc:hover::before{opacity:1;}

/* SVG иконки — фиксированный размер, не сжимаются */
.btn svg{
  width:32px;height:32px;
  min-width:32px;min-height:32px;
  position:relative;z-index:1;
  transition:transform .25s ease, filter .25s ease;
  flex-shrink:0;
  display:block;
}
.btn:hover svg{transform:scale(1.15);}
.btn-yt:hover svg{filter:drop-shadow(0 0 8px rgba(255,0,0,.6));}
.btn-dc:hover svg{filter:drop-shadow(0 0 8px rgba(88,101,242,.6));}
.btn-tw:hover svg{filter:drop-shadow(0 0 8px rgba(145,70,255,.6));}
.btn-tg:hover svg{filter:drop-shadow(0 0 8px rgba(38,165,228,.6));}
.btn-sc:hover svg{filter:drop-shadow(0 0 8px rgba(255,85,0,.6));}

.btn-label{
  position:relative;z-index:1;
  letter-spacing:.5px;
  font-size:.72rem;
  color:rgba(232,232,240,.75);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}

/* ========== MEDIA PLAYER ========== */
.player-wrap{
  width:100%;
  opacity:0;transform:translateY(20px);
  animation:fadeUp .5s ease forwards;
  animation-delay:.3s;
}

.player{
  background:var(--card);
  border:none;
  border-radius:18px;
  padding:14px 16px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  position:relative;
  overflow:hidden;
  transition:box-shadow .3s ease;
}

/* Artwork */
.player-art{
  width:64px;height:64px;
  min-width:64px;min-height:64px;
  border-radius:10px;
  background:transparent;
  border:1px solid var(--border);
  overflow:hidden;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:box-shadow .3s ease;
  position:relative;
}
.player-art:hover{ box-shadow:0 0 18px rgba(145,70,255,.3); }
.player-art img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  display:none;
}
.player-art img.visible{ display:block; }
.player-art-icon{
  color:var(--muted);
  transition:opacity .3s;
}
.player-art-icon.hidden{ opacity:0; }

/* Info */
.player-info{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.player-title{
  font-size:.82rem;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-title.empty{ color:var(--muted); }

/* Progress bar */
.player-progress{
  display:flex;
  align-items:center;
  gap:8px;
}
.time{
  font-size:.65rem;
  color:var(--muted);
  min-width:28px;
  font-variant-numeric:tabular-nums;
}
.time.right{ text-align:right; }
.track{
  flex:1;
  height:4px;
  background:rgba(255,255,255,.08);
  border-radius:99px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.track-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7B22FF,#BF7FFF);
  border-radius:99px;
  transition:width .1s linear;
  pointer-events:none;
}
.track:hover .track-fill{ filter:brightness(1.3); }

/* Controls */
.player-controls{
  display:flex;
  align-items:center;
  gap:4px;
  flex-shrink:0;
}
.ctrl-btn{
  background:none;border:none;
  color:var(--muted);
  cursor:pointer;
  padding:6px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s, background .2s, transform .15s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  min-width:32px;min-height:32px;
}
.ctrl-btn:hover{ color:var(--text); background:rgba(255,255,255,.06); }
.ctrl-btn:active{ transform:scale(.9); }
.ctrl-btn.play-btn{
  color:var(--text);
  background:rgba(145,70,255,.15);
  border:1px solid rgba(145,70,255,.25);
  border-radius:50%;
  width:36px;height:36px;
  min-width:36px;min-height:36px;
}
.ctrl-btn.play-btn:hover{
  background:rgba(145,70,255,.3);
  box-shadow:0 0 14px rgba(145,70,255,.3);
}

/* Volume row */
.vol-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 2px;
  margin-top:2px;
}
.vol-icon{ color:var(--muted); flex-shrink:0; }
.vol-track{ flex:1; position:relative; }
.vol-val{
  font-size:.65rem;
  color:var(--muted);
  min-width:32px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

/* Range input */
#volSlider{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:4px;
  border-radius:99px;
  background: linear-gradient(to right, #7B22FF var(--val), rgba(255,255,255,.08) var(--val));
  outline:none;
  cursor:pointer;
  transition:height .15s ease;
}
#volSlider:hover{ height:6px; }
#volSlider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;
  border-radius:50%;
  background:#BF7FFF;
  box-shadow:0 0 6px rgba(145,70,255,.6);
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
}
#volSlider::-webkit-slider-thumb:hover{
  transform:scale(1.3);
  box-shadow:0 0 12px rgba(145,70,255,.8);
}
#volSlider::-moz-range-thumb{
  width:14px;height:14px;
  border-radius:50%;border:none;
  background:#BF7FFF;
  box-shadow:0 0 6px rgba(145,70,255,.6);
  cursor:pointer;
}

/* Entrance animation */
.container > *{
  opacity:0;transform:translateY(20px);
  animation:fadeUp .5s ease forwards;
}
.avatar  {animation-delay:.05s;}
h1       {animation-delay:.1s;}
.divider {animation-delay:.15s;}
.grid    {animation-delay:.2s;}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

/* ========== MOBILE RESPONSIVE ========== */
@media (max-width: 400px){
  .container{
    padding:28px 14px;
    gap:16px;
  }

  .btn{
    padding:14px 6px;
    gap:7px;
    border-radius:14px;
  }

  .btn svg{
    width:28px;height:28px;
    min-width:28px;min-height:28px;
  }

  .btn-label{
    font-size:.68rem;
  }

  h1{font-size:2rem;}

  .player{
    padding:12px 12px;
    gap:10px;
  }

  .player-art{
    width:56px;height:56px;
    min-width:56px;min-height:56px;
  }
}

@media (min-width: 401px) and (max-width: 520px){
  .container{
    padding:32px 16px;
  }

  .btn svg{
    width:30px;height:30px;
    min-width:30px;min-height:30px;
  }
}
</style>

        </button>
      </div>

      <!-- Volume row -->
      <div class="vol-row">
        <svg id="volIcon" class="vol-icon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <div class="vol-track">
          <input type="range" id="volSlider" min="0" max="100" value="90" style="--val:90%" aria-label="Громкость">
        </div>
        <span class="vol-val" id="volValue">90%</span>
      </div>

    </div>
  </div>

</div><!-- /container -->

<audio id="audio"></audio>

<script>
// ======================================================
//  ТРЕКИ — кидай файлы в ту же папку что и index.html
//  src   — имя аудиофайла (например 'track1.mp3')
//  title — название трека в плеере
//  cover — имя картинки-обложки, или '' если не нужно
// ======================================================
const TRACKS = [
  { src: 'track.mp3', title: 'Yung Lean - Smirnoff Ice', cover: 'avatar667.png' },
  // { src: 'track2.mp3', title: 'Трек 2', cover: '' },
];
// ======================================================

let idx = 0;
let isLoaded = false;

const audio      = document.getElementById('audio');
const playBtn    = document.getElementById('playBtn');
const iconPlay   = document.getElementById('iconPlay');
const iconPause  = document.getElementById('iconPause');
const trackFill  = document.getElementById('trackFill');
const trackBar   = document.getElementById('trackBar');
const timeCur    = document.getElementById('timeCur');
const timeDur    = document.getElementById('timeDur');
const trackTitle = document.getElementById('trackTitle');
const player     = document.getElementById('player');
const artImg     = document.getElementById('artImg');
const artIcon    = document.getElementById('artIcon');
const volSlider  = document.getElementById('volSlider');
const volIcon    = document.getElementById('volIcon');
const volValue   = document.getElementById('volValue');

function fmt(s){
  s = Math.floor(s) || 0;
  return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
}

function loadTrack(i, autoplay){
  if(!TRACKS.length) return;
  idx = (i + TRACKS.length) % TRACKS.length;
  const t = TRACKS[idx];
  audio.src = t.src;
  audio.load();
  trackTitle.textContent = t.title;
  trackTitle.classList.remove('empty');
  if(t.cover){
    artImg.src = t.cover;
    artImg.classList.add('visible');
    artIcon.classList.add('hidden');
  } else {
    artImg.src = '';
    artImg.classList.remove('visible');
    artIcon.classList.remove('hidden');
  }
  timeCur.textContent = '0:00';
  timeDur.textContent = '0:00';
  trackFill.style.width = '0%';
  isLoaded = true;
  if(autoplay) audio.play().catch(()=>{});
}
if(TRACKS.length) loadTrack(0, false);

// Громкость
audio.volume = 0.9;

volSlider.addEventListener('input', ()=>{
  const v = volSlider.value / 100;
  audio.volume = v;
  volValue.textContent = volSlider.value + '%';
  volSlider.style.setProperty('--val', volSlider.value + '%');
  // Смена иконки громкости
  if(v === 0){
    volIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
  } else if(v < 0.5){
    volIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
  } else {
    volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }
});

// Play/Pause
playBtn.addEventListener('click', ()=>{
  if(!isLoaded) return;
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
});

audio.addEventListener('play', ()=>{
  iconPlay.style.display = 'none';
  iconPause.style.display = '';
  player.classList.add('playing');
});
audio.addEventListener('pause', ()=>{
  iconPlay.style.display = '';
  iconPause.style.display = 'none';
  player.classList.remove('playing');
});
audio.addEventListener('ended', ()=>{
  loadTrack(idx + 1, true);
});

audio.addEventListener('timeupdate', ()=>{
  if(!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  trackFill.style.width = pct + '%';
  timeCur.textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', ()=>{
  timeDur.textContent = fmt(audio.duration);
});

// Клик по прогрессбару
trackBar.addEventListener('click', e => {
  if(!audio.duration) return;
  const r = trackBar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});

// Touch для прогрессбара
trackBar.addEventListener('touchstart', e => {
  e.preventDefault();
  if(!audio.duration) return;
  const r = trackBar.getBoundingClientRect();
  audio.currentTime = ((e.touches[0].clientX - r.left) / r.width) * audio.duration;
}, { passive: false });

document.getElementById('prevBtn').addEventListener('click', ()=>{ loadTrack(idx - 1, true); });
document.getElementById('nextBtn').addEventListener('click', ()=>{ loadTrack(idx + 1, true); });
</script>

</body>
</html>
